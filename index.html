<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avi & Divya — Engagement</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#1B2340;
  --ink-2:#242C4E;
  --sand:#EDE6D6;
  --sand-2:#E4DBC7;
  --gold:#B8933F;
  --clay:#C97B5A;
  --ivory:#F7F3EA;
  --charcoal:#23262F;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Jost',sans-serif;
  background:var(--sand);
  color:var(--charcoal);
  font-weight:300;
  overflow-x:hidden;
}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  font-weight:500;
}

/* ---------- INVITATION CARD ---------- */
.invite{
  padding:11vh 6vw 6vh;
  display:flex;
  justify-content:center;
  animation:riseIn 1.1s cubic-bezier(.19,1,.22,1) both;
}
@keyframes riseIn{
  from{opacity:0; transform:translateY(22px);}
  to{opacity:1; transform:translateY(0);}
}
.invite img{
  width:100%;
  max-width:440px;
  height:auto;
  display:block;
  border:1px solid rgba(27,35,64,0.08);
  box-shadow:0 30px 60px -30px rgba(27,35,64,0.35);
}

/* ---------- RSVP (ticket) ---------- */
.rsvp{
  padding:8vh 8vw 16vh;
  display:flex;
  justify-content:center;
}
.ticket{
  width:100%;
  max-width:560px;
  background:var(--ivory);
  border:1px solid rgba(27,35,64,0.14);
  position:relative;
  padding:44px 40px 38px;
  box-shadow:0 30px 60px -30px rgba(27,35,64,0.25);
}
.ticket-main .eyebrow{ color:var(--clay); margin-bottom:16px; }
.ticket-main h3{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:400;
  font-size:30px;
  color:var(--ink);
  margin-bottom:10px;
}
.ticket-main p{
  font-size:14.5px;
  line-height:1.6;
  color:var(--charcoal);
  opacity:0.8;
  max-width:38ch;
}

.tear{
  position:relative;
  height:1px;
  border-top:1.5px dashed rgba(27,35,64,0.22);
  margin:30px -40px 30px;
}
.tear::before, .tear::after{
  content:"";
  position:absolute;
  top:-9px;
  width:18px; height:18px;
  border-radius:50%;
  background:var(--sand);
}
.tear::before{ left:-9px; }
.tear::after{ right:-9px; }

.rsvp-form{ display:flex; flex-direction:column; gap:20px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.field{ display:flex; flex-direction:column; gap:8px; }
.field label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink);
  opacity:0.6;
}
.field input, .field select, .field textarea{
  font-family:'Jost',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:none;
  border:none;
  border-bottom:1px solid rgba(27,35,64,0.22);
  padding:6px 2px 10px;
  outline:none;
  transition:border-color .25s ease;
  appearance:none;
  -webkit-appearance:none;
}
.field select{
  background-image:linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position:calc(100% - 4px) 12px, calc(100% - 10px) 12px;
  background-size:6px 6px;
  background-repeat:no-repeat;
}
.field textarea{ resize:vertical; min-height:44px; font-family:'Jost',sans-serif; }
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--gold); }
.field input::placeholder, .field textarea::placeholder{ color:rgba(35,38,47,0.35); }

.submit-btn{
  align-self:flex-start;
  margin-top:6px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:none;
  border:none;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--ink);
  padding-bottom:4px;
  border-bottom:1px solid var(--ink);
  transition:color .3s ease, border-color .3s ease;
}
.submit-btn:hover{ color:var(--gold); border-color:var(--gold); }
.submit-btn .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--gold);
}
.submit-btn:disabled{ opacity:0.5; cursor:default; }

.form-status{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.06em;
  margin-top:2px;
}
.form-status.error{ color:#a4462f; }

.rsvp-success{
  text-align:center;
  padding:20px 0 6px;
}
.rsvp-success .eyebrow{ color:var(--clay); margin-bottom:14px; }
.rsvp-success h3{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:400;
  font-size:28px;
  color:var(--ink);
  margin-bottom:8px;
}
.rsvp-success p{ font-size:14.5px; color:var(--charcoal); opacity:0.8; }

/* ---------- FOOTER ---------- */
footer{
  background:var(--sand-2);
  padding:8vh 8vw 7vh;
  text-align:center;
}
.monogram{
  width:56px; height:56px;
  border:1px dashed rgba(184,147,63,0.6);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 18px;
  font-family:'Fraunces',serif;
  font-style:italic;
  color:var(--gold);
  font-size:20px;
}
footer p{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--ink);
  opacity:0.55;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width:760px){
  .invite{ padding:8vh 8vw 4vh; }
  .ticket{ padding:36px 24px 32px; }
  .tear{ margin:26px -24px 26px; }
  .field-row{ grid-template-columns:1fr; gap:20px; }
}

:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<section class="invite">
  <img src="images/engagement_invitation_final.jpg" alt="Avi & Divya Engagement Invitation">
</section>

<section class="rsvp" id="rsvp">
  <div class="ticket">
    <div class="ticket-main">
      <div class="eyebrow">Kindly Respond</div>
      <h3>Save us a seat</h3>
      <p>We'd love to know you're coming. Please RSVP by 5 November.</p>
    </div>
    <div class="tear"></div>
    <form class="rsvp-form" data-event="Engagement" data-subject="RSVP - Avi & Divya's Engagement" onsubmit="return submitRSVP(event, this)" action="https://formspree.io/f/moeakqab" method="POST">
      <div class="field-row">
        <div class="field">
          <label for="eng-name">Full name</label>
          <input id="eng-name" name="name" type="text" placeholder="Divya" required>
        </div>
        <div class="field">
          <label for="eng-attending">Attending</label>
          <select id="eng-attending" name="attending" required>
            <option value="" disabled selected>Choose one</option>
            <option value="Joyfully accepts">Joyfully accepts</option>
            <option value="Regretfully declines">Regretfully declines</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="eng-guests">Guests (incl. you)</label>
          <input id="eng-guests" name="guests" type="number" min="1" max="6" value="1" required>
        </div>
        <div class="field">
          <label for="eng-email">Email</label>
          <input id="eng-email" name="email" type="email" placeholder="you@email.com" required>
        </div>
      </div>
      <div class="field">
        <label for="eng-note">Message (optional)</label>
        <textarea id="eng-note" name="message" rows="2" placeholder="A note for the couple"></textarea>
      </div>
      <input type="hidden" name="_subject" value="RSVP - Avi & Divya's Engagement">
      <input type="hidden" name="event" value="Engagement">
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <button type="submit" class="submit-btn"><span class="dot"></span>Send RSVP</button>
      <div class="form-status" role="status"></div>
    </form>
    <div class="rsvp-success" hidden>
      <div class="eyebrow">Received</div>
      <h3>Thank you</h3>
      <p>Your RSVP is in — we can't wait to celebrate with you.</p>
    </div>
  </div>
</section>

<footer>
  <div class="monogram">A&amp;D</div>
  <p>See you there</p>
</footer>

<script>
function submitRSVP(evt, form){
  evt.preventDefault();
  var btn = form.querySelector('.submit-btn');
  var status = form.querySelector('.form-status');
  var ticket = form.closest('.ticket');
  var success = ticket.querySelector('.rsvp-success');

  btn.disabled = true;
  status.textContent = 'Sending…';
  status.classList.remove('error');

  fetch(form.action, {
    method:'POST',
    headers:{ 'Accept':'application/json' },
    body:new FormData(form)
  }).then(function(res){
    if(res.ok){
      form.style.display = 'none';
      ticket.querySelector('.tear').hidden = true;
      success.hidden = false;
    } else {
      throw new Error('Request failed');
    }
  }).catch(function(){
    btn.disabled = false;
    status.classList.add('error');
    status.textContent = "Couldn't send — please try again, or email us directly.";
  });

  return false;
}
</script>

</body>
</html>
